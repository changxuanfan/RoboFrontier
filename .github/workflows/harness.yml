name: Harness

# Offline harness checks: the protocol contract without physics plus every Node host
# test (check_harness), and both engines' frozen inputs and access rules, run layout,
# segments and evidence storage; a second job runs the paper-statistics, analysis and
# operator-script tests without scene assets. No model is called; installed-CLI tests
# skip when a CLI is absent.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked
      - name: Restore pinned policy assets
        run: .venv/bin/python -m robofrontier.cli bootstrap
      - name: Protocol contract (physics blocked)
        run: .venv/bin/python -m scripts.check_harness --protocol-only --report harness-protocol.json
      - name: Engine parity, run layout, segments and evidence storage
        run: |
          PYTHONPATH=tests:scripts .venv/bin/python -m unittest \
            runtime.test_policy_env engines.test_engine_parity runtime.test_run_layout runtime.test_run_segments batch.test_session_archive tasks.test_process_log \
            runtime.test_portable_scene batch.test_durable batch.test_claude_engineering_batch engines.test_claude_standing_team
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-protocol
          path: harness-protocol.json
          if-no-files-found: ignore

  # Paper statistics, run analysis, operator scripts and config/record consistency.
  # No scene assets are restored, so nothing here can load a scene or step physics.
  analysis-and-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked
      - name: Analysis, scripts and records (no assets, no physics)
        run: |
          PYTHONPATH=tests:scripts .venv/bin/python -m unittest \
            batch.test_run_metrics analysis.test_run_analysis_atomic repo.test_oracle_batch_summary repo.test_communication_report \
            batch.test_policy_archive batch.test_evidence_zip repo.test_scripts_index repo.test_script_checks repo.test_workflows \
            repo.test_curate_repository runtime.test_build_policy_env engines.test_codex_cli_check engines.test_codex_launch_profiles \
            media.test_render_policy_videos media.test_render_targets \
            media.test_dial_entrypoints batch.test_benchmark_handoff repo.test_configs_readme repo.test_pruned_paths
