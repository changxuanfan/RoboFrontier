name: Task atlas

on:
  pull_request:
    paths:
      - '.github/workflows/task-atlas.yml'
      - 'scripts/build_task_atlas.py'
      - 'tests/test_task_atlas.py'
      - 'web/task-atlas/**'
      - 'docs/task-atlas/**'
      - 'benchmark/**'
      - 'configs/environments/**'
      - 'robofrontier/task_families.py'
      - 'robofrontier/task_config.py'
      - 'robofrontier/suite/tasks.py'
      - 'robofrontier/suite/v2.py'
      - 'prompts/**'
      - 'scripts/benchmark_handoff.py'
      - 'configs/policy-assets.json'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified public task atlas to GitHub Pages'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked
      - name: Verify current public atlas and portable ZIP restoration
        run: |
          .venv/bin/python -m scripts.build_task_atlas verify
          PYTHONPATH=tests:scripts .venv/bin/python -m unittest test_task_atlas
      - name: Configure Pages for an explicit publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/configure-pages@v5
      - name: Upload only the verified public site
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/task-atlas
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
