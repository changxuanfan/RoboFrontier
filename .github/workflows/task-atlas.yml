name: Task atlas

on:
  pull_request:
    paths:
      - '.github/workflows/task-atlas.yml'
      - 'scripts/build_task_atlas.py'
      - 'tests/test_task_atlas.py'
      - 'web/task-atlas/**'
      - 'docs/task-atlas/**'
      - 'benchmark/**'
      - 'configs/environments/**'
      - 'robofrontier/task_families.py'
      - 'robofrontier/task_config.py'
      - 'robofrontier/suite/tasks.py'
      - 'robofrontier/suite/v2.py'
      - 'prompts/**'
      - 'scripts/benchmark_handoff.py'
      - 'configs/policy-assets.json'
      - 'uv.lock'
      - 'pyproject.toml'
  workflow_dispatch:

# The project page (site/, deployed by site.yml) replaced the atlas on GitHub Pages;
# this workflow only verifies the atlas and its offline ZIP.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked
      - name: Verify current public atlas and portable ZIP restoration
        run: |
          .venv/bin/python -m scripts.build_task_atlas verify
          PYTHONPATH=tests:scripts .venv/bin/python -m unittest test_task_atlas
