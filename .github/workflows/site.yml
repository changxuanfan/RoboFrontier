name: Project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check the page's data files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          tasks = json.loads(Path('site/data/tasks.json').read_text())
          media = json.loads(Path('site/data/media.json').read_text())
          results = json.loads(Path('site/data/results.json').read_text())
          assert len(tasks['tasks']) == 36, 'expected the 36 released tasks'
          assert all(s['base'].startswith('https://') for s in media['sets']), 'media must point at published URLs'
          assert results['schema'] == 'robofrontier.site-results.v1'
          assert 'SYNTHETIC' not in json.dumps(results), 'never publish a test fixture'
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload the page only (local media, fixtures and explorations are ignored)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
