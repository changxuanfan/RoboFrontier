# RunPod or another plain Linux host without a GPU: four level-3 runs on the CPU renderer.
# Codex with ChatGPT login: log in once to ~/.roboteam/codex-home. Start with
# `roboteam run BATCH --durable` (a systemd user service, or a setsid daemon).
schema_version = 11

[policy]
harness = "codex"
model = "sol_subscription"
effort = "high"
system = "adaptive"

[batch]
parallel = 4
task_wall_limit_s = 86400.0

[selection]
level = 3
cases = ["transport-large-l3", "mosaic-large-l3", "relay-large-l3", "dial-large-l3"]

[render]
device = "cpu"

[runtime]
codex_tool_backend = "landlock-v1"
codex_home_scope = "shared"

[paths]
# Keep runs on the pod's persistent volume; the policy can never read it (access table).
runs_root = "/workspace/roboteam-runs"
