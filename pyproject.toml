[project]
name = "roboteam"
version = "0.1.0"
description = "A multi-robot benchmark: can multimodal agents work together on long physical tasks?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA.md"]
authors = [{ name = "Changxuan Fan" }, { name = "The RoboTeam authors" }]
keywords = ["benchmark", "multi-agent", "robotics", "mujoco", "llm-agents", "manipulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "glfw>=2.8,<3",
    "pillow>=11,<13",
    "scipy>=1.18.1,<2",
]

[project.scripts]
roboteam = "roboteam.cli:main"

[project.urls]
Homepage = "https://changxuanfan.github.io/RoboTeam/"
Repository = "https://github.com/changxuanfan/RoboTeam"
Issues = "https://github.com/changxuanfan/RoboTeam/issues"
Paper = "https://arxiv.org/abs/2611.22138"

# Tools for working on the code (CONTRIBUTING.md). `uv sync` installs them; a run does not need them.
[dependency-groups]
dev = ["ruff==0.17.5"]

# The package runs from a checkout only: it reads roboteam.toml, models.json, prompts/ and
# benchmark/ from the repository root, so a wheel installed elsewhere does not work.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roboteam"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = [".", "tests", "tests/helpers"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long string literals, URLs and table rows stay on one line; code lines are wrapped by the formatter.
ignore = ["E501"]
