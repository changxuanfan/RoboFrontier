[project]
name = "robofrontier"
version = "0.1.0"
description = "A multi-robot benchmark: can multimodal agents work together on long physical tasks?"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA.md"]
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "glfw>=2.8,<3",
    "pillow>=11,<13",
    "scipy>=1.18.1",
]

[project.scripts]
robofrontier = "robofrontier.cli:main"
robofrontier-demo = "robofrontier.demo.app:main"

[project.urls]
Repository = "https://github.com/changxuanfan/RoboFrontier"

[project.optional-dependencies]
oracle = ["greenlet==3.2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robofrontier"]
