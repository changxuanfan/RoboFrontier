# Slurm, Codex subscription, one job of 36 runs. Planning example only: reading it logs in to
# nothing and submits nothing. Copy it to an untracked site TOML and review the resources.
schema_version = 9

[policy]
engine = "codex"
profile = "luna_subscription"
effort = "high"
topology = "adaptive"

[batch]
parallel = 36
task_wall_limit_s = 86400.0

[render]
device = "nvidia"
record_realtime_video = false

[runtime]
codex_home_scope = "job"
codex_home = ""
codex_tool_backend = "landlock-v1"

[slurm]
auth_mode = "subscription"
# Replace with a canonical private directory on durable operator storage.
# Only a reference is frozen at submission; no credentials are copied then.
credential_store = "/ABSOLUTE/PRIVATE/robofrontier-luna"
# The Mac route, for clusters that cannot reach the model API themselves; the Mac must stay
# on. The reference carries no proxy password, endpoint snapshot or native credential.
# egress_mode = "mac-ssh"
# egress_root = "/ABSOLUTE/PRIVATE/robofrontier-egress"
# egress_wait_s = 120
gpus = 1
# Initial resource requests, not measured concurrency guarantees. Confirm the
# site's definition of an allocated CPU and the node's available resources.
cpus_per_task = 72
memory_gib = 128
