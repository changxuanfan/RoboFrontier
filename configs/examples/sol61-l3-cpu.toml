# Native ChatGPT authentication: log in once to ~/.robofrontier/codex-home.
# Four L3 tasks. Prepare separate new batches to compare the four topologies.
[policy]
engine = "codex"
profile = "sol61_subscription"
effort = "high"
topology = "adaptive"

[batch]
parallel = 4
task_wall_limit_s = 86400.0

[selection]
level = 3
cases = ["transport-a12-d3", "mosaic-a08-12x24-d3", "relay-a16-d3", "dial-best5-n08-d3"]

[render]
device = "cpu"

[runtime]
codex_tool_backend = "landlock-v1"
codex_home_scope = "shared"
